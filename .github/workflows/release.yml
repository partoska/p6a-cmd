name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev rpm
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: p6a_linux_amd64
          path: build/src/p6a
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages_linux_amd64
          path: dist/
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev rpm
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel 1
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: p6a_linux_arm64
          path: build/src/p6a
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages_linux_arm64
          path: dist/
  build-linux-armhf:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Register QEMU handlers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build in Raspberry Pi OS (ARMv6)
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD":/src -w /src \
            --entrypoint /bin/bash \
            balenalib/rpi-raspbian:bookworm -eu -o pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                build-essential cmake libcurl4-openssl-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON
              cmake --build build --parallel "$(nproc)"
              cpack --config build/CPackConfig.cmake -G "DEB;TGZ"
              chown -R '"$(id -u):$(id -g)"' build dist
            '
      - name: Verify ARMv6 output
        run: |
          readelf -A build/src/p6a | grep -E "Tag_CPU_arch:|Tag_FP_arch:"
          readelf -A build/src/p6a | grep -q "Tag_CPU_arch: v6" || {
            echo "::error::binary is not ARMv6, it will not run on a Pi Zero W"
            exit 1
          }
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD":/src -w /src \
            --entrypoint /src/build/src/p6a \
            balenalib/rpi-raspbian:bookworm version
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: p6a_linux_armhf
          path: build/src/p6a
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages_linux_armhf
          path: dist/
  build-windows-amd64:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: true
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON -DCURL_USE_STATIC_LIBS=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 1
      - name: Package (ZIP)
        shell: msys2 {0}
        run: cpack --config build/CPackConfig.cmake -G ZIP
      - name: Package (NSIS)
        shell: msys2 {0}
        run: |
          VERSION=$(grep "CMAKE_PROJECT_VERSION:STATIC" build/CMakeCache.txt | cut -d= -f2)
          cpack --config build/CPackConfig.cmake -G NSIS -D CPACK_PACKAGE_FILE_NAME="p6a_${VERSION}_windows_amd64_setup"
      - name: Package (WIX)
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath "$WIX")/bin:$PATH"
          cpack --config build/CPackConfig.cmake -G WIX
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: p6a_windows_amd64
          path: build/src/p6a.exe
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages_windows_amd64
          path: dist/
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          cache: true
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-curl
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON -DCURL_USE_STATIC_LIBS=ON
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 1
      - name: Package (ZIP)
        shell: msys2 {0}
        run: cpack --config build/CPackConfig.cmake -G ZIP
      - name: Package (NSIS)
        shell: msys2 {0}
        run: |
          VERSION=$(grep "CMAKE_PROJECT_VERSION:STATIC" build/CMakeCache.txt | cut -d= -f2)
          cpack --config build/CPackConfig.cmake -G NSIS -D CPACK_PACKAGE_FILE_NAME="p6a_${VERSION}_windows_arm64_setup"
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: p6a_windows_arm64
          path: build/src/p6a.exe
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages_windows_arm64
          path: dist/
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: brew install curl pkg-config
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_SANITIZERS=OFF -DWITH_VERBOSE_DEBUG=OFF -DWITH_TESTS=OFF -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      - name: Build
        run: cmake --build build --parallel 1
      - name: Package
        run: cpack --config build/CPackConfig.cmake
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: p6a_darwin_universal
          path: build/src/p6a
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages_darwin_universal
          path: dist/
  release:
    needs:
      [
        build-linux-amd64,
        build-linux-arm64,
        build-linux-armhf,
        build-windows-amd64,
        build-windows-arm64,
        build-macos,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
      - name: Create release
        run: gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename binaries
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          cp artifacts/p6a_linux_amd64/p6a p6a_${VERSION}_linux_amd64
          cp artifacts/p6a_linux_arm64/p6a p6a_${VERSION}_linux_arm64
          cp artifacts/p6a_linux_armhf/p6a p6a_${VERSION}_linux_armhf
          cp artifacts/p6a_windows_amd64/p6a.exe p6a_${VERSION}_windows_amd64.exe
          cp artifacts/p6a_windows_arm64/p6a.exe p6a_${VERSION}_windows_arm64.exe
          cp artifacts/p6a_darwin_universal/p6a p6a_${VERSION}_darwin_universal
      - name: Upload binaries to release
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          gh release upload ${{ github.ref_name }} p6a_${VERSION}_linux_amd64 p6a_${VERSION}_linux_arm64 p6a_${VERSION}_linux_armhf p6a_${VERSION}_windows_amd64.exe p6a_${VERSION}_windows_arm64.exe p6a_${VERSION}_darwin_universal --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload packages to release
        run: gh release upload ${{ github.ref_name }} artifacts/packages_*/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm-publish:
    needs: [release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
      - name: Stamp version into npm packages
        run: |
          set -euo pipefail
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const main = "npm/p6a/package.json";
            const files = [
              main,
              "npm/p6a-darwin/package.json",
              "npm/p6a-linux-x64/package.json",
              "npm/p6a-linux-arm64/package.json",
              "npm/p6a-win32-x64/package.json",
              "npm/p6a-win32-arm64/package.json",
            ];
            for (const f of files) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = version;
              if (f === main) {
                for (const k of Object.keys(j.optionalDependencies)) {
                  j.optionalDependencies[k] = version;
                }
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$VERSION"
      - name: Verify all package versions match
        run: |
          set -euo pipefail
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const files = [
              "npm/p6a/package.json",
              "npm/p6a-darwin/package.json",
              "npm/p6a-linux-x64/package.json",
              "npm/p6a-linux-arm64/package.json",
              "npm/p6a-win32-x64/package.json",
              "npm/p6a-win32-arm64/package.json",
            ];
            let ok = true;
            for (const f of files) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              if (j.version !== version) {
                console.error(`::error::${f} version ${j.version} != ${version}`);
                ok = false;
              }
            }
            const main = JSON.parse(fs.readFileSync("npm/p6a/package.json", "utf8"));
            for (const [k, v] of Object.entries(main.optionalDependencies)) {
              if (v !== version) {
                console.error(`::error::optionalDependency ${k} pinned to ${v} != ${version}`);
                ok = false;
              }
            }
            if (!ok) process.exit(1);
            console.log("all five packages at " + version);
          ' "$VERSION"
      - name: Stage native binaries into platform packages
        run: |
          set -euo pipefail
          declare -A SRC=(
            [npm/p6a-darwin/bin/p6a]=artifacts/p6a_darwin_universal/p6a
            [npm/p6a-linux-x64/bin/p6a]=artifacts/p6a_linux_amd64/p6a
            [npm/p6a-linux-arm64/bin/p6a]=artifacts/p6a_linux_arm64/p6a
            [npm/p6a-win32-x64/bin/p6a.exe]=artifacts/p6a_windows_amd64/p6a.exe
            [npm/p6a-win32-arm64/bin/p6a.exe]=artifacts/p6a_windows_arm64/p6a.exe
          )
          for dest in "${!SRC[@]}"; do
            src="${SRC[$dest]}"
            if [ ! -f "$src" ]; then
              echo "::error::missing expected binary artifact: $src"
              exit 1
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
          done
          chmod +x \
            npm/p6a-darwin/bin/p6a \
            npm/p6a-linux-x64/bin/p6a \
            npm/p6a-linux-arm64/bin/p6a
      - name: Publish platform packages
        run: |
          set -euo pipefail
          for d in npm/p6a-darwin npm/p6a-linux-x64 npm/p6a-linux-arm64 npm/p6a-win32-x64 npm/p6a-win32-arm64; do
            ( cd "$d" && npm publish --provenance --access public )
          done
      - name: Publish main package
        run: ( cd npm/p6a && npm publish --provenance --access public )
  homebrew-update:
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: partoska/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: p6a_darwin_universal
          path: artifacts/darwin/
      - uses: actions/download-artifact@v7
        with:
          name: p6a_linux_amd64
          path: artifacts/linux_amd64/
      - uses: actions/download-artifact@v7
        with:
          name: p6a_linux_arm64
          path: artifacts/linux_arm64/
      - name: Update formula
        run: |
          set -euo pipefail
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          SHA256_DARWIN=$(shasum -a 256 artifacts/darwin/p6a | cut -d' ' -f1)
          SHA256_LINUX_AMD64=$(shasum -a 256 artifacts/linux_amd64/p6a | cut -d' ' -f1)
          SHA256_LINUX_ARM64=$(shasum -a 256 artifacts/linux_arm64/p6a | cut -d' ' -f1)
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/p6a.rb
          sed -i "/darwin_universal/{n; s/sha256 \".*\"/sha256 \"${SHA256_DARWIN}\"/}" Formula/p6a.rb
          sed -i "/linux_amd64/{n; s/sha256 \".*\"/sha256 \"${SHA256_LINUX_AMD64}\"/}" Formula/p6a.rb
          sed -i "/linux_arm64/{n; s/sha256 \".*\"/sha256 \"${SHA256_LINUX_ARM64}\"/}" Formula/p6a.rb
      - name: Commit and push
        run: |
          VERSION=${{ github.ref_name }}
          git config user.name "p6a-ops"
          git config user.email "p6a-ops@users.noreply.github.com"
          git add Formula/p6a.rb
          git commit -m "Update p6a to ${VERSION}"
          git push
  scoop-update:
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout scoop-bucket
        uses: actions/checkout@v6
        with:
          repository: partoska/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: p6a_windows_amd64
          path: artifacts/windows_amd64/
      - uses: actions/download-artifact@v7
        with:
          name: p6a_windows_arm64
          path: artifacts/windows_arm64/
      - name: Update manifest
        run: |
          set -euo pipefail
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          SHA256_AMD64=$(shasum -a 256 artifacts/windows_amd64/p6a.exe | cut -d' ' -f1)
          SHA256_ARM64=$(shasum -a 256 artifacts/windows_arm64/p6a.exe | cut -d' ' -f1)
          node -e '
            const fs = require("fs");
            const [version, sha256Amd64, sha256Arm64] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync("bucket/p6a.json", "utf8"));
            manifest.version = version;
            manifest.architecture["64bit"].url =
              `https://github.com/partoska/p6a-cmd/releases/download/v${version}/p6a_${version}_windows_amd64.exe#/p6a.exe`;
            manifest.architecture["64bit"].hash = sha256Amd64;
            manifest.architecture["arm64"].url =
              `https://github.com/partoska/p6a-cmd/releases/download/v${version}/p6a_${version}_windows_arm64.exe#/p6a.exe`;
            manifest.architecture["arm64"].hash = sha256Arm64;
            fs.writeFileSync("bucket/p6a.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$SHA256_AMD64" "$SHA256_ARM64"
      - name: Commit and push
        run: |
          VERSION=${{ github.ref_name }}
          git config user.name "p6a-ops"
          git config user.email "p6a-ops@users.noreply.github.com"
          git add bucket/p6a.json
          git commit -m "Update p6a to ${VERSION}"
          git push
